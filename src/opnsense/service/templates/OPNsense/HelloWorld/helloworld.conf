{% if not helpers.empty('OPNsense.helloworld.general.Enabled') %}
[general]
SMTPHost={{ OPNsense.helloworld.general.SMTPHost|default("smtp.gmail.com") }}
SMTPPort={{ OPNsense.helloworld.general.SMTPPort|default("587") }}
SMTPUsername={{ OPNsense.helloworld.general.SMTPUsername|default("") }}
SMTPPassword={{ OPNsense.helloworld.general.SMTPPassword|default("") }}
FromEmail={{ OPNsense.helloworld.general.FromEmail|default("") }}
ToEmail={{ OPNsense.helloworld.general.ToEmail|default("") }}
Subject={{ OPNsense.helloworld.general.Subject|default("Test Email from OPNsense") }}
Description={{ OPNsense.helloworld.general.Description|default("Test message!") }}
{% endif %}
