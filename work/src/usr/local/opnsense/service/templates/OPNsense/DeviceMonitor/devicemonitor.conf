{% if not helpers.empty('OPNsense.devicemonitor.general.Enabled') %}
[general]
Enabled={{ OPNsense.devicemonitor.general.Enabled|default("0") }}
MQTTBroker={{ OPNsense.devicemonitor.general.MQTTBroker|default("localhost") }}
MQTTPort={{ OPNsense.devicemonitor.general.MQTTPort|default("1883") }}
MQTTUsername={{ OPNsense.devicemonitor.general.MQTTUsername|default("") }}
MQTTPassword={{ OPNsense.devicemonitor.general.MQTTPassword|default("") }}
MQTTTopic={{ OPNsense.devicemonitor.general.MQTTTopic|default("opnsense/telemetry") }}
TelemetryInterval={{ OPNsense.devicemonitor.general.TelemetryInterval|default("60") }}
DeviceID={{ OPNsense.devicemonitor.general.DeviceID|default("opnsense-device") }}
CollectCPU={{ OPNsense.devicemonitor.general.CollectCPU|default("1") }}
CollectMemory={{ OPNsense.devicemonitor.general.CollectMemory|default("1") }}
CollectNetwork={{ OPNsense.devicemonitor.general.CollectNetwork|default("1") }}
CollectDisk={{ OPNsense.devicemonitor.general.CollectDisk|default("1") }}
CollectTemperature={{ OPNsense.devicemonitor.general.CollectTemperature|default("0") }}
{% endif %}